name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock ruff
      - name: Lint
        run: ruff check src/ main.py launcher.py build.py
      - name: Run tests
        run: >
          pytest -q
          tests/test_functional.py tests/test_jira_features.py
          tests/test_new_features.py tests/test_extended.py
          tests/test_datetimeutil.py tests/test_recurring.py
          tests/test_updater.py tests/test_updater_download.py
          tests/test_update_flow.py tests/test_settings.py
          tests/test_tags.py tests/test_bulk_transition.py
          test_integration_ux.py
        # test_launcher.py / test_stress.py need a real venv layout or are
        # timing-sensitive -> run those locally, not in CI.

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: TaskManager-windows.exe
            artifact: dist/TaskManager.exe
          - os: ubuntu-latest
            asset: TaskManager-linux
            artifact: dist/TaskManager
          - os: macos-latest
            asset: TaskManager-macos
            artifact: dist/TaskManager
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build executable
        run: python build.py --clean

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.artifact }}" "out/${{ matrix.asset }}"
          cp version.txt "out/version.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ matrix.asset }}
            out/version.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
